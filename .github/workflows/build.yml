
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: 3.11
          buildozer-cmd: |
            echo "=== PREPARING ANDROID DEPENDENCIES ==="

            buildozer -v android debug || true

            echo "=== LOCATING LIBTHORVG ==="

            python - <<'PY'
            from pathlib import Path
            import re

            roots = [
                Path(".buildozer"),
                Path.home() / ".local",
            ]

            recipes = []

            for root in roots:
                if root.exists():
                    recipes.extend(
                        p for p in root.rglob("__init__.py")
                        if p.parent.name == "libthorvg"
                    )

            if not recipes:
                raise SystemExit(
                    "ERROR: libthorvg was not found after preparation."
                )

            recipe = recipes[0]
            print("Recipe:", recipe)

            source = recipe.read_text()

            source = re.sub(
                r'(-Dextra=[^"\n]*),openmp',
                r'\1',
                source
            )

            source = re.sub(
                r'(?ms)^[ \t]*# copy libomp\.so.*?'
                r'^[ \t]*shprint\(sh\.cp, libomp, join\("install", "lib"\)\)\n?',
                '',
                source
            )

            recipe.write_text(source)

            print("=== LIBTHORVG PATCH APPLIED ===")
            PY

            echo "=== BUILDING APK ==="
            buildozer -v android debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ./bin/*.apk
          if-no-files-found: error
