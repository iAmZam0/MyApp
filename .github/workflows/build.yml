
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: 3.11
          buildozer-cmd: |
            echo "=== PREPARING DEPENDENCIES ==="
            buildozer -v android debug || true

            echo "=== PATCHING LIBTHORVG ==="

            python - <<'PY'
            from pathlib import Path
            import re

            roots = [
                Path(".buildozer"),
                Path.home() / ".buildozer",
            ]

            recipes = []

            for root in roots:
                if root.exists():
                    recipes.extend(root.rglob("libthorvg/__init__.py"))

            recipes = list(dict.fromkeys(recipes))

            if not recipes:
                raise SystemExit("ERROR: libthorvg recipe not found")

            for recipe in recipes:
                print("\nPatching:", recipe)

                source = recipe.read_text()

                # Disable OpenMP.
                source, config_count = re.subn(
                    r'(-Dextra=[^"\n]*)openmp',
                    lambda m: m.group(1).rstrip(","),
                    source
                )

                # Remove libomp from built_libraries.
                source, library_count = re.subn(
                    r'^[ \t]*"libomp\.so":\s*"install/lib",?\s*\n',
                    '',
                    source,
                    flags=re.M
                )

                # Remove the entire optional libomp copy section.
                source, block_count = re.subn(
                    r'(?ms)^[ \t]*# copy libomp\.so.*?'
                    r'^[ \t]*shprint\(sh\.cp, libomp, join\("install", "lib"\)\)[ \t]*\n?',
                    '',
                    source
                )

                # Verify the unsafe lookup is gone.
                if "clang_lib_dir = glob(pattern)[0]" in source:
                    raise SystemExit(
                        "ERROR: Unsafe Clang lookup remains in " + str(recipe)
                    )

                if "clang_lib_dir = glob(pattern)" in source:
                    raise SystemExit(
                        "ERROR: Clang lookup remains in " + str(recipe)
                    )

                recipe.write_text(source)

                print("OpenMP config changes:", config_count)
                print("Library entries removed:", library_count)
                print("Copy blocks removed:", block_count)
                print("PATCH VERIFIED")

            print("\nALL RECIPES PATCHED")
            PY

            echo "=== SECOND BUILD ==="
            buildozer -v android debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ./bin/*.apk
          if-no-files-found: error
